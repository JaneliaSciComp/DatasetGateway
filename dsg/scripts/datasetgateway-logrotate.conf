# logrotate stanza for the detached dev server's serve.log (interim).
#
# `pixi run serve-bg` (scripts/serve.sh --detach) runs `runserver --noreload`
# with `>> serve.log 2>&1`, so the process holds one O_APPEND descriptor on
# serve.log for its whole life and nothing reopens the file. That dictates
# `copytruncate`: logrotate copies the content to logs/serve.log-<stamp>, then
# truncates serve.log in place; the next write lands at the new end of file
# (O_APPEND), so there is no restart, no signal and no sparse gap. Do NOT switch
# to rename-and-recreate (`create`): the server would keep writing to the
# renamed file forever. The only loss is whatever is written between the copy
# and the truncate.
#
# Rotated files are plaintext (no compress) and are shipped to nearline by
# scripts/ship-rotated-logs.sh, which datasetgateway-logrotate.service runs
# right after logrotate. That shipper keeps only the two newest rotated files
# locally, so `rotate 60` below is merely the cap on how much *unshipped*
# backlog can pile up while nearline is unreachable.
#
# Install (as root, adjust the placeholders <...> for your host; see the header
# of datasetgateway-logrotate.service for the full sequence):
#   sed -e 's#<path-to>#/path/to#g' -e 's#<dsg-user>#USER#g' -e 's#<dsg-group>#GROUP#g' \
#       scripts/datasetgateway-logrotate.conf > /etc/dsg/datasetgateway-logrotate.conf
# The state file is passed explicitly by the service (--state
# <path-to>/DatasetGateway/dsg/logrotate.state) so this works for a non-root
# service user without touching /var/lib/logrotate.
#
# Remove this arrangement at the gunicorn/systemd cutover (docs/admin-manual.md):
# journald owns local retention from then on.

<path-to>/DatasetGateway/dsg/serve.log {
    # Threshold checked whenever the timer fires (daily), not a hard ceiling.
    size 50M
    copytruncate
    nocompress
    # Rotated copies go to dsg/logs/, named serve.log-YYYYmmddTHHMMSS so
    # several rotations on one day never collide and names sort by time.
    olddir logs
    createolddir 0750 <dsg-user> <dsg-group>
    dateext
    dateformat -%Y%m%dT%H%M%S
    rotate 60
    missingok
    notifempty
}
