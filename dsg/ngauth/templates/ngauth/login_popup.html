<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Completing login</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; text-align: center; }
    </style>
</head>
<body>
    <h2>Completing login</h2>
    <p>You may close this window.</p>

    {# json_script escapes for a <script> context; both values reach the page from a query string. #}
    {{ payload|json_script:"ngauth-payload" }}
    {{ origin|json_script:"ngauth-origin" }}
    <script>
      (function () {
        var payload = JSON.parse(document.getElementById('ngauth-payload').textContent);
        var origin = JSON.parse(document.getElementById('ngauth-origin').textContent);
        // Neuroglancer's waitForLogin() listens on the opener for a message from
        // this server's origin carrying either {token: …} or "badorigin".
        if (window.opener) {
          window.opener.postMessage(payload, origin);
        }
        window.close();
      }());
    </script>
</body>
</html>
